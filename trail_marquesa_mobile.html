<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trail Marquesa 12K - Training App</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #1D9E75;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-main: #1E293B;
            --text-sec: #64748B;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        /* Header Dinámico */
        .race-header {
            background: linear-gradient(135deg, #1D9E75, #0F6E56);
            color: white;
            padding: 24px 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            margin-bottom: 20px;
        }

        .countdown-row { display: flex; align-items: center; justify-content: space-between; }
        .days-circle { 
            background: rgba(255,255,255,0.2); 
            width: 60px; height: 60px; 
            border-radius: 50%; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
        }

        /* Selector de Semana */
        .week-nav {
            padding: 0 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            background: white;
            font-size: 15px;
            font-weight: 600;
        }

        /* Carrusel de Días - UX Crucial para Mobile */
        .days-carousel {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 5px 20px 15px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .days-carousel::-webkit-scrollbar { display: none; }

        .day-item {
            flex: 0 0 65px;
            background: white;
            padding: 12px 5px;
            border-radius: 14px;
            text-align: center;
            border: 2px solid transparent;
            box-shadow: var(--shadow);
            scroll-snap-align: start;
        }

        .day-item.active { border-color: var(--primary); background: #E1F5EE; }
        .day-item.today { background: #F1F5F9; border-style: dashed; border-color: #CBD5E1; }

        .day-item .name { font-size: 11px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; }
        .day-item .date { font-size: 13px; font-weight: 600; margin: 4px 0; }
        .day-item .icon { font-size: 20px; }

        /* Tarjeta de Sesión */
        .session-card {
            margin: 0 20px;
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .badge-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .type-run { background: #E1F5EE; color: #0F6E56; }
        .type-strength { background: #EEEDFE; color: #534AB7; }
        .type-rest { background: #F1F5F9; color: #475569; }

        .session-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
        .session-desc { font-size: 15px; color: #475569; border-top: 1px solid #F1F5F9; padding-top: 15px; }

        /* Talón Input - Touch friendly */
        .talon-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #F1F5F9;
        }
        .talon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .talon-btn {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .talon-btn.active-low { background: #1D9E75; color: white; border-color: #1D9E75; }
        .talon-btn.active-high { background: #EF4444; color: white; border-color: #EF4444; }

        .footer-notes {
            margin: 20px;
            padding: 15px;
            background: #FEF3C7;
            border-radius: 12px;
            font-size: 13px;
            color: #92400E;
        }
    </style>
</head>
<body>

<div id="app">
    <header class="race-header">
        <div class="countdown-row">
            <div>
                <h1 style="font-size: 18px;">Trail La Marquesa 12K</h1>
                <p style="font-size: 13px; opacity: 0.9;">20 Septiembre, 2026</p>
            </div>
            <div class="days-circle">
                <span id="days-val" style="font-size: 20px; font-weight: 800;">--</span>
                <span style="font-size: 9px; font-weight: 600;">DÍAS</span>
            </div>
        </div>
    </header>

    <nav class="week-nav">
        <select id="week-select"></select>
    </nav>

    <div class="days-carousel" id="days-carousel">
        </div>

    <main class="session-card">
        <div class="badge-row" id="session-badges"></div>
        <h2 class="session-title" id="session-title">Selecciona un día</h2>
        <p class="session-desc" id="session-desc"></p>

        <div class="talon-container" id="talon-section" style="display:none;">
            <p style="font-size: 13px; font-weight: 700;"><i class="ph ph-footprints"></i> NIVEL DE DOLOR EN TALÓN (1-10)</p>
            <div class="talon-grid" id="talon-btns"></div>
            <p id="talon-warning" style="font-size: 12px; margin-top: 10px; font-weight: 600;"></p>
        </div>
    </main>

    <div class="footer-notes">
        <strong>⚠️ Protocolo:</strong> Dolor >3/10 = repetir semana. Hidratación isotónica requerida.
    </div>
</div>

    let currentWeekIdx = 0;
    let selectedDayIdx = 0;

    function init() {
        renderWeekSelect();
        updateView();
        
        const raceDate = new Date(2026, 8, 20);
        const today = new Date(2026, 4, 10);
        const diff = Math.ceil((raceDate - today) / (1000 * 60 * 60 * 24));
        document.getElementById('days-val').textContent = diff;
    }

    function renderWeekSelect() {
        const sel = document.getElementById('week-select');
        WEEKS.forEach((w, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Semana ${w.num}: ${w.phase}`;
            sel.appendChild(opt);
        });
        sel.addEventListener('change', (e) => {
            currentWeekIdx = parseInt(e.target.value);
            selectedDayIdx = 0;
            updateView();
        });
    }

    function updateView() {
        renderCarousel();
        renderSession();
    }

    function renderCarousel() {
        const container = document.getElementById('days-carousel');
        container.innerHTML = '';
        const week = WEEKS[currentWeekIdx];

        week.days.forEach((day, i) => {
            const div = document.createElement('div');
            div.className = `day-item ${i === selectedDayIdx ? 'active' : ''}`;
            div.innerHTML = `
                <div class="name">${day.name}</div>
                <div class="date">${day.date.split(' ')[0]}</div>
                <div class="icon">${day.icon}</div>
            `;
            div.onclick = () => {
                selectedDayIdx = i;
                updateView();
            };
            container.appendChild(div);
        });
    }

    function renderSession() {
        const day = WEEKS[currentWeekIdx].days[selectedDayIdx];
        document.getElementById('session-title').textContent = day.short;
        document.getElementById('session-desc').textContent = day.detail;
        
        const badges = document.getElementById('session-badges');
        badges.innerHTML = `<span class="badge type-${day.type}">${day.type}</span>`;
        
        // Manejo de Talón
        const talonSec = document.getElementById('talon-section');
        if(day.talon) {
            talonSec.style.display = 'block';
            renderTalonBtns();
        } else {
            talonSec.style.display = 'none';
        }
    }

    function renderTalonBtns() {
        const grid = document.getElementById('talon-btns');
        grid.innerHTML = '';
        for(let i=1; i<=10; i++) {
            const btn = document.createElement('div');
            btn.className = 'talon-btn';
            btn.textContent = i;
            btn.onclick = () => {
                document.querySelectorAll('.talon-btn').forEach(b => b.classList.remove('active-low', 'active-high'));
                btn.classList.add(i > 3 ? 'active-high' : 'active-low');
                document.getElementById('talon-warning').textContent = i > 3 ? "🛑 Repetir semana recomendada" : "✅ Nivel aceptable";
                document.getElementById('talon-warning').style.color = i > 3 ? "#EF4444" : "#1D9E75";
            };
            grid.appendChild(btn);
        }
    }

    init();
</script>
